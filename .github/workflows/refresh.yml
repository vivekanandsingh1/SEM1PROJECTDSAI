name: Refresh data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "First day to load (YYYY-MM-DD), default yesterday"
        required: false
      end:
        description: "Last day to load (YYYY-MM-DD), default same as start"
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GHPULSE_LAKE_PATH: data/lake
      GHPULSE_SERVING_PATH: data/serving
      GHPULSE_AUDIT_PATH: data/audit
      GHPULSE_WAREHOUSE_URL: ${{ secrets.GHPULSE_WAREHOUSE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Run pipeline for full days
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          START="${START:-$(date -u -d yesterday +%F)}"
          END="${END:-$START}"
          python scripts/backfill.py "${START}T00:00" "${END}T23:00"
